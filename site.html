<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>"WorkSpace"</title>
</head>
<style>
body{
   background-color:#000000;
   font-family: Arial, sans-serif;
   margin: 0;
   padding: 20px;
}
h1{
    text-align: center;
    color:aqua;
}
.btn-danger {
            background-color: transparent;
            color: aqua;
            border: 2px solid aqua;
        }

        .btn-danger:hover {
            background-color: aqua;
            color: white;
            transform: translateY(-2px);
        }
</style>

<body>
    <h1>Olá como posso ajudar hoje</h1>
      <h2>Consulta de Endereço</h2>

    <div class="form-group">
        <label for="cep">Digite o CEP:</label>
        <input type="text" id="cep" placeholder="Ex: 01001000" maxlength="8">
        <button id="btnBuscar">Buscar Endereço</button>
    </div>

    <div id="mensagem-erro" class="erro"></div>

    <div class="form-group">
        <label for="rua">Rua:</label>
        <input type="text" id="rua" readonly>
    </div>

    <div class="form-group">
        <label for="bairro">Bairro:</label>
        <input type="text" id="bairro" readonly>
    </div>

    <div class="form-group">
        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" readonly>
    </div>

    <div class="form-group">
        <label for="estado">Estado:</label>
        <input type="text" id="estado" readonly>
    </div>
    <script>
            document.getElementById('btnBuscar').addEventListener('click', async () => {
            const cepInput = document.getElementById('cep').value.replace(/\D/g, '');
            const erroDiv = document.getElementById('mensagem-erro');
            
            
            erroDiv.innerText = '';

            if (cepInput.length !== 8) {
                erroDiv.innerText = 'Por favor, digite um CEP válido com 8 dígitos.';
                return;
            }

            try {
                const resposta = await fetch(`https://brasilapi.com.br{cepInput}`);
                
                if (!resposta.ok) {
                    throw new Error('CEP não encontrado.');
                }

                const dados = await resposta.json();

                document.getElementById('rua').value = dados.street || 'Não informado';
                document.getElementById('bairro').value = dados.neighborhood || 'Não informado';
                document.getElementById('cidade').value = dados.city;
                document.getElementById('estado').value = dados.state;

            } catch (erro) {
                erroDiv.innerText = 'Erro ao buscar o CEP. Verifique o número e tente novamente.';
            
                document.getElementById('rua').value = '';
                document.getElementById('bairro').value = '';
                document.getElementById('cidade').value = '';
                document.getElementById('estado').value = '';
            }
        });
    </script>

    
</body>
</html>
