<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test de api</title>

  <style>
    body{
      background:#111;
      color:white;
      font-family:Arial;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }

    .card{
      background:#1e1e1e;
      padding:30px;
      border-radius:10px;
      width:300px;
      text-align:center;
      border:1px solid #333;
    }

    button{
      background:#ff00ff;
      border:none;
      padding:10px 20px;
      cursor:pointer;
      border-radius:5px;
      margin-top:15px;
      font-weight:bold;
    }

    #resultado{
      margin-top:20px;
      color:#ff00c8;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>API test</h1>

    <p>Clique para buscar um CEP de usuario</p>

    <button onclick="buscarCep()">
      Buscar
    </button>

    <div id="resultado"></div>
  </div>

  <script>

    async function buscarCep(){

      const resposta = await fetch(
        'https://viacep.com.br/ws/01001000/json/'
      );

      const dados = await resposta.json();

      if (dados.erro) {

        document.getElementById("resultado").innerHTML =
          "CEP inválido";

        return;
      }

      document.getElementById("resultado").innerHTML = `
        <p><b>Bairro:</b> ${dados.bairro}</p>
        <p><b>Cidade:</b> ${dados.localidade}</p>
        <p><b>Estado:</b> ${dados.uf}</p>
      `;

    }
    </script>
</body>
</html>
