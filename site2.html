```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WorkSpace</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(135deg, #000000, #021b1b);

            color: white;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;

            background: rgba(0, 0, 0, 0.85);

            border: 2px solid aqua;
            border-radius: 20px;

            padding: 35px;

            box-shadow: 0 0 25px rgba(0, 255, 255, 0.3);
        }

        h1 {
            text-align: center;
            color: aqua;

            margin-bottom: 10px;
            font-size: 32px;
        }

        h2 {
            text-align: center;

            margin-bottom: 25px;

            color: #ffffff;
            font-size: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;

            margin-bottom: 18px;
        }

        label {
            margin-bottom: 8px;

            color: aqua;
            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 2px solid aqua;
            border-radius: 10px;

            background-color: #111111;
            color: white;

            outline: none;

            transition: 0.3s;
        }

        input:focus {
            box-shadow: 0 0 12px aqua;
        }

        button {
            width: 100%;

            padding: 14px;

            border: 2px solid aqua;
            border-radius: 10px;

            background: transparent;

            color: aqua;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            background-color: aqua;
            color: black;

            transform: translateY(-2px);

            box-shadow: 0 0 15px aqua;
        }

        .erro {
            margin-top: 15px;
            margin-bottom: 15px;

            color: #ff4d4d;

            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>WorkSpace</h1>
        <h2>Consulta de Endereço</h2>

        <div class="form-group">
            <label for="cep">Digite o CEP:</label>

            <input 
                type="text" 
                id="cep" 
                placeholder="Ex: 01001000"
                maxlength="8"
            >
        </div>

        <button id="btnBuscar">
            Buscar Endereço
        </button>

        <div id="mensagem-erro" class="erro"></div>

        <div class="form-group">
            <label for="rua">Rua:</label>

            <input 
                type="text" 
                id="rua" 
                readonly
            >
        </div>

        <div class="form-group">
            <label for="bairro">Bairro:</label>

            <input 
                type="text" 
                id="bairro" 
                readonly
            >
        </div>

        <div class="form-group">
            <label for="cidade">Cidade:</label>

            <input 
                type="text" 
                id="cidade" 
                readonly
            >
        </div>

        <div class="form-group">
            <label for="estado">Estado:</label>

            <input 
                type="text" 
                id="estado" 
                readonly
            >
        </div>

    </div>

    <script>

        const btnBuscar = document.getElementById('btnBuscar');

        btnBuscar.addEventListener('click', async () => {

            const cep = document
                .getElementById('cep')
                .value
                .replace(/\D/g, '');

            const erroDiv = document.getElementById('mensagem-erro');

            erroDiv.innerText = '';

            if (cep.length !== 8) {

                erroDiv.innerText =
                    'Digite um CEP válido com 8 números.';

                limparCampos();

                return;
            }

            try {

                const resposta = await fetch(
                    `https://brasilapi.com.br/api/cep/v1/${cep}`
                );

                if (!resposta.ok) {
                    throw new Error('CEP não encontrado');
                }

                const dados = await resposta.json();

                document.getElementById('rua').value =
                    dados.street || 'Não informado';

                document.getElementById('bairro').value =
                    dados.neighborhood || 'Não informado';

                document.getElementById('cidade').value =
                    dados.city || 'Não informado';

                document.getElementById('estado').value =
                    dados.state || 'Não informado';

            } catch (erro) {

                erroDiv.innerText =
                    'Erro ao buscar o CEP.';

                limparCampos();
            }

        });

        function limparCampos() {

            document.getElementById('rua').value = '';

            document.getElementById('bairro').value = '';

            document.getElementById('cidade').value = '';

            document.getElementById('estado').value = '';
        }

    </script>

</body>

</html>
